services:
  envoy:
    image: renukafernando/envoy-gperftools:v1.34.1
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ./envoy/log:/var/log/envoy
    command: envoy -c /etc/envoy/envoy.yaml --service-cluster front-proxy --file-flush-interval-msec 50 -l info --component-log-level ext_proc:trace
    ports:
      - "18080:18080" # with ext proc
      - "18081:18081" # stream mode override
      - "19090:19090" # no ext proc
      - "9901:9901" # admin port
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "2"
          memory: 2G

  echo-netty:
    image: renukafernando/netty-http-echo-service:0.4.6-arm # for arm64
    # image: renukafernando/netty-http-echo-service:0.4.6 # for x86
    command: ["-m", "1g", "--", "--max-content-length", "1000000000"]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1500M
        reservations:
          cpus: "1"
          memory: 1500M
  ext-proc-mode-override:
    build:
      context: ./external-processor-mode-override
      dockerfile: Dockerfile
    command: ["-port", "9003", "-write_data_to_file"]
    volumes:
      - ./temp:/app/temp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 1G

