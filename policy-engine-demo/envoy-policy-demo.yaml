# Envoy configuration for the policy-engine-demo.
#
# Listens on port 18081 (separate from the existing 18080 demo).
# Ext_proc points to policy-engine-demo on port 9002.
# Admin interface on port 9903.
#
# Demo routes:
#   POST /v1/chat/completions  → OpenAI (PII masking + SSE streaming support)
#   GET  /httpbin              → httpbin.konghq.com (set-headers demo)
#
# Usage (from docker-compose or bare host):
#   docker run --rm -p 18081:18081 -p 9903:9903 \
#     -v $(pwd)/policy-engine-demo/envoy-policy-demo.yaml:/etc/envoy/envoy.yaml \
#     envoyproxy/envoy:distroless-v1.36.4
#
# Requires policy-engine-demo to be running:
#   go run ./policy-engine-demo -port 9002

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9903

static_resources:

  listeners:
  - name: policy_demo_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 18081
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: policy_demo
          codec_type: AUTO

          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: policy_engine_demo
              # Default processing mode: headers always sent, body buffered by default.
              # The policy-engine-demo kernel overrides modes per-request at RequestHeaders
              # and optionally upgrades response body to FULL_DUPLEX_STREAMED at ResponseHeaders
              # when a streaming upstream is detected.
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SEND
                request_body_mode: BUFFERED
                response_body_mode: BUFFERED
                request_trailer_mode: SKIP
                response_trailer_mode: SKIP
              # CRITICAL: allow_mode_override must be true for the kernel's dynamic
              # BUFFERED → FULL_DUPLEX_STREAMED upgrade at ResponseHeaders to work.
              allow_mode_override: true
              # Send route metadata so the kernel can look up the policy chain.
              metadata_options:
                forwarding_namespaces:
                  untyped:
                  - envoy.filters.http.ext_proc

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: policy_demo_routes
            virtual_hosts:
            - name: policy_demo_vhost
              domains: ["*"]

              routes:
              # ── OpenAI chat completions ─────────────────────────────────────
              # policy chain: pii-masking-regex (buffers request, streams response)
              - name: openai-chat
                match:
                  prefix: "/v1/chat/completions"
                route:
                  cluster: openai_cluster
                  timeout: 120s
                  retry_policy:
                    retry_on: "5xx"
                    num_retries: 0
                metadata:
                  filter_metadata:
                    envoy.filters.http.ext_proc:
                      route_name: "openai-chat"

              # ── httpbin test endpoint ───────────────────────────────────────
              # policy chain: set-headers (header mutations only)
              - name: httpbin-test
                match:
                  prefix: "/httpbin"
                route:
                  cluster: httpbin_cluster
                  prefix_rewrite: "/anything"
                metadata:
                  filter_metadata:
                    envoy.filters.http.ext_proc:
                      route_name: "httpbin-test"

  clusters:

  # ── policy-engine-demo gRPC server ─────────────────────────────────────────
  - name: policy_engine_demo
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: policy_engine_demo
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: host.docker.internal
                port_value: 9002

  # ── OpenAI upstream ─────────────────────────────────────────────────────────
  - name: openai_cluster
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: openai_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api.openai.com
                port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com

  # ── httpbin upstream ─────────────────────────────────────────────────────────
  - name: httpbin_cluster
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: httpbin_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: httpbin.konghq.com
                port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: httpbin.konghq.com
